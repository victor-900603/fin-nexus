        <div class="h3 char-2">   第 一 章 總則</div>
        <div class="row"><div class="col-no"> <a href="LawSingle.aspx?pcode=G0400001&flno=1" name="1">第 1 條</a></div><div class="col-data"><div class="law-article">
<div class="line-0000">為發展國民經濟，並保障投資，特制定本法。</div></div>
</div></div>
        <div class="row"><div class="col-no"> <a href="LawSingle.aspx?pcode=G0400001&flno=4" name="4">第 4 條</a></div><div class="col-data"><div class="law-article">
<div class="line-0000 show-number">本法所稱公司，謂依公司法組織之股份有限公司。</div><div class="line-0000 show-number">本法所稱外國公司，謂以營利為目的，依照外國法律組織登記之公司。</div></div>
</div></div>
        <div class="row"><div class="col-no"> <a href="LawSingle.aspx?pcode=G0400001&flno=9" name="9">第 9 條</a></div><div class="col-data"><div class="law-article">
<div class="line-0000">（刪除）</div></div>
</div></div>
        <div class="h3 char-3">      第 一 節 有價證券之募集、發行及買賣</div>
        <div class="row"><div class="col-no"> <a href="LawSingle.aspx?pcode=G0400001&flno=14-1" name="14-1">第 14-1 條</a></div><div class="col-data"><div class="law-article">
<div class="line-0000 show-number">公開發行公司應建立財務、業務之內部控制制度。</div><div class="line-0004">一、內部控制制度之設計。</div><div class="line-0004">二、內部控制制度之執行。</div><div class="line-0006">（一）營運之效果及效率。</div><div class="line-0006">（二）報導具可靠性。</div></div>
</div></div>
