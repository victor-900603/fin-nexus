[project]
name = "fin-nexus"
version = "0.0.0"
description = "金融財報與法規混合檢索增強檢索系統"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "FlagEmbedding>=1.4",
    "httpx>=0.27",
    "lxml>=5.3",
    "mineru>=4.0,<5",
    "opencc-python-reimplemented>=0.1.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "qdrant-client>=1.12",
    "torch>=2.7",
    "transformers>=4.44",
    "uvicorn>=0.30",
]

[project.scripts]
fin-nexus = "fin_nexus.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_nexus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["FlagEmbedding.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=fin_nexus --cov-report=term-missing"

[tool.coverage.run]
source = ["fin_nexus"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.importlinter]
root_package = "fin_nexus"

[[tool.importlinter.contracts]]
name = "架構分層"
type = "layers"
layers = [
    "fin_nexus.cli",
    "fin_nexus.api | fin_nexus.eval",
    "fin_nexus.ingest | fin_nexus.retrieval | fin_nexus.generation",
    "fin_nexus.storage",
    "fin_nexus.contracts | fin_nexus.http",
    "fin_nexus.logging",
    "fin_nexus.text",
    "fin_nexus.models",
    "fin_nexus.config",
]

[[tool.importlinter.contracts]]
name = "generation 不依賴 retrieval"
type = "forbidden"
source_modules = ["fin_nexus.generation"]
forbidden_modules = ["fin_nexus.retrieval"]

[[tool.importlinter.contracts]]
name = "retrieval 不依賴 ingest"
type = "forbidden"
source_modules = ["fin_nexus.retrieval"]
forbidden_modules = ["fin_nexus.ingest"]

[[tool.importlinter.contracts]]
name = "storage 不依賴 ingest"
type = "forbidden"
source_modules = ["fin_nexus.storage"]
forbidden_modules = ["fin_nexus.ingest"]

[[tool.importlinter.contracts]]
name = "eval 不依賴 api"
type = "forbidden"
source_modules = ["fin_nexus.eval"]
forbidden_modules = ["fin_nexus.api"]

[[tool.importlinter.contracts]]
name = "api.schema 不依賴 retrieval"
type = "forbidden"
source_modules = ["fin_nexus.api.schema"]
forbidden_modules = ["fin_nexus.retrieval"]
