[project]
name = "finrag"
version = "0.0.0"
description = "金融財報與法規混合檢索增強檢索系統"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.3",
    "mineru>=4.0,<5",
    "opencc-python-reimplemented>=0.1.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=finrag --cov-report=term-missing"

[tool.coverage.run]
source = ["finrag"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
