services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: fin-nexus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  qdrant_storage:
    name: fin_nexus_qdrant_storage
